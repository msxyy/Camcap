name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\camcap.exe dist\camcap.exe
          Compress-Archive -Path dist\camcap.exe -DestinationPath camcap-windows-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: camcap-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false